[workspace]
resolver = "2"

[package]
# The Zephyr Rust module currently requires this package name for
# rust_cargo_application().  Keep this package in its own workspace so the
# reusable crate's root workspace never resolves Zephyr's bindgen dependencies.
name = "rustapp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "nRF7002 Rust provisioning and Embassy HTTP proof firmware"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[features]
# A Zephyr application build always uses the runtime.  Keeping it as a feature
# lets the bounded gate state machine be checked on the host without pulling in
# the generated Zephyr bindings or requiring a Zephyr build directory.
default = ["zephyr-runtime"]

zephyr-runtime = [
    "dep:zephyr",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-net",
    "dep:static_cell",
    "dep:zeroize",
    "dep:embassy-zephyr-nrf7002",
]

[target.'cfg(target_arch = "arm")'.dependencies]
# The Zephyr module's rust_cargo_application() supplies this exact package from
# modules/lang/rust.  Do not replace it with the unrelated crates.io package
# also named "zephyr" outside a Zephyr build.  Keeping all Zephyr-side crates
# target-specific means they are not compiled into host-side helper binaries;
# the generated Zephyr Cargo configuration is still required to resolve this
# official module package.
zephyr = { version = "=0.1.0", default-features = false, features = ["time-driver", "executor-zephyr"], optional = true }

# These versions intentionally match zephyr-lang-rust's supported Embassy
# integration.  In particular, do not move this proof to the root firmware's
# Embassy 0.10 executor.
embassy-executor = { version = "=0.7.0", default-features = false, features = ["task-arena-size-8192"], optional = true }
embassy-time = { version = "=0.4.0", default-features = false, features = ["tick-hz-1_000"], optional = true }
embassy-net = { version = "=0.9.1", default-features = false, features = ["dhcpv4", "medium-ethernet", "tcp"], optional = true }
static_cell = { version = "=2.1.1", default-features = false, optional = true }
zeroize = { version = "=1.9.0", default-features = false, optional = true }

# This is the only Rust-side Zephyr adapter. Its public API owns the opaque
# handles and maps the private namespaced foundation ABI into safe Rust
# status/events; this application never declares a second C ABI of its own.
embassy-zephyr-nrf7002 = { path = "../..", features = ["zephyr", "embassy-net"], optional = true }
