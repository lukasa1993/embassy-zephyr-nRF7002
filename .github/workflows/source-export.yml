name: Source export

on:
  push:
    branches:
      - native-embassy-nrf7002

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create a source archive
        run: tar --exclude=.git -czf "$RUNNER_TEMP/embassy-nrf7002-source.tar.gz" .

      - name: Upload the source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: embassy-nrf7002-source
          path: ${{ runner.temp }}/embassy-nrf7002-source.tar.gz
          if-no-files-found: error
          retention-days: 1
