name: Apply production API fix v2

on:
  push:
    branches:
      - native-embassy-nrf7002

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry one-shot production API fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: native-embassy-nrf7002
          fetch-depth: 0

      - name: Install Rust
        run: |
          set -euxo pipefail
          rustup toolchain install 1.95.0 \
            --profile minimal \
            --component rustfmt,clippy \
            --target thumbv8m.main-none-eabihf

      - name: Apply the production API corrections
        run: |
          set -euxo pipefail
          printf '%s' '' | base64 -d > /tmp/production.patch
          git apply --check /tmp/production.patch
          git apply /tmp/production.patch
          cargo +1.95.0 fmt --all
          git diff --check

      - name: Run the complete host test matrix
        run: |
          set -euxo pipefail
          cargo +1.95.0 test --no-default-features
          cargo +1.95.0 test --features embassy-net
          cargo +1.95.0 test --features wpa2
          cargo +1.95.0 test --all-features

      - name: Run Clippy
        run: cargo +1.95.0 clippy --all-targets --all-features -- -D warnings

      - name: Check no-std targets
        env:
          RUSTFLAGS: -D warnings
        run: |
          set -euxo pipefail
          cargo +1.95.0 check --lib --no-default-features --target thumbv8m.main-none-eabihf
          cargo +1.95.0 check --lib --features embassy-net,wpa2 --target thumbv8m.main-none-eabihf

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.95.0 doc --lib --all-features --no-deps

      - name: Commit the verified correction
        run: |
          set -euxo pipefail
          rm .github/workflows/apply-production-fix.yml
          rm .github/workflows/apply-production-fix-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/production.rs src/runtime.rs src/wpa2_runtime.rs tests/public_api.rs .github/workflows/apply-production-fix.yml .github/workflows/apply-production-fix-v2.yml
          git commit -m 'Compile and expose the fail-closed production API'
          git push origin HEAD:native-embassy-nrf7002
