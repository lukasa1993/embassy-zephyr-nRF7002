name: CI

on:
  push:
    branches: [main, native-embassy-nrf7002]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target thumbv8m.main-none-eabihf
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run host tests
        run: cargo test --all-features
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check the no-std core
        run: cargo check --lib --no-default-features --target thumbv8m.main-none-eabihf
      - name: Check the no-std Embassy adapter
        run: cargo check --lib --features embassy-net --target thumbv8m.main-none-eabihf
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  nordic-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned Nordic host interface
        run: |
          git init /tmp/nrf_wifi
          git -C /tmp/nrf_wifi remote add origin https://github.com/zephyrproject-rtos/nrf_wifi.git
          git -C /tmp/nrf_wifi fetch --depth 1 origin 5046744cb4c9640eb8b11cb92f1ea0b9554c20cf
          git -C /tmp/nrf_wifi checkout --detach FETCH_HEAD
      - name: Check packed sizes and offsets
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I/tmp/nrf_wifi/fw_if/umac_if/inc \
            -I/tmp/nrf_wifi/fw_if/umac_if/inc/fw \
            -I/tmp/nrf_wifi/hw_if/hal/inc \
            tests/layout_probe.c \
            -o /tmp/nrf7002-layout-probe
          /tmp/nrf7002-layout-probe
