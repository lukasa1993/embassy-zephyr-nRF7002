name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wpa2-sequence-tests:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out the driver branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: native-embassy-nrf7002
          persist-credentials: true
          fetch-depth: 2

      - name: Reuse and correct the guarded test patch
        run: |
          set -euxo pipefail
          git show HEAD^:.github/workflows/ci.yml > /tmp/previous-ci.yml
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('/tmp/previous-ci.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Install Rust toolchains"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          script = script.replace(
              "use core::task::{Context, Poll, Wake, Waker};",
              "use core::task::{Context, Poll, Waker};\n    use std::task::Wake;",
          )
          Path('/tmp/apply_tests.py').write_text(script + '\n')
          PY
          python3 /tmp/apply_tests.py

      - name: Install Rust toolchains
        run: |
          set -euxo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target thumbv8m.main-none-eabihf
          rustup toolchain install 1.85.0 --profile minimal --target thumbv8m.main-none-eabihf

      - name: Format and verify
        run: |
          set -euxo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 test --all-features
          cargo +1.95.0 clippy --all-targets --all-features -- -D warnings
          cargo +1.95.0 check --lib --features embassy-net,wpa2 --target thumbv8m.main-none-eabihf
          RUSTDOCFLAGS='-D warnings' cargo +1.95.0 doc --lib --all-features --no-deps
          cargo +1.85.0 check --lib --features embassy-net,wpa2 --target thumbv8m.main-none-eabihf

      - name: Commit the verified tests
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "Test WPA2 fail-closed radio sequencing"
          git push origin HEAD:native-embassy-nrf7002
