# Architecture B Stage 0: stock nRF70 station plus an Ethernet L2 packet
# socket.  There is deliberately no address family above AF_PACKET here.

CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_READY_LIB=y
# AP support and nRF70 low-power mode are mutually exclusive in NCS v3.4;
# RPU recovery depends on that low-power mode. Keep the resulting limitation
# explicit for this dual-VIF foundation instead of accepting a stale y request.
CONFIG_NRF_WIFI_RPU_RECOVERY=n

# Compile every product-supported runtime role into the frozen mechanism
# layer. Rust explicitly selects and configures STA/AP operations at runtime;
# neither interface is administratively raised by Zephyr at boot.
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=y
# Reconnect and roaming are the two deliberate mechanism-side exceptions to
# Rust-owned policy. The supplicant retains the active runtime profile for
# reconnect, while the bridge drives Zephyr's stock 11r/11k/BTM/legacy roaming
# sequence when its signal-change events fire.
CONFIG_WIFI_NM_WPA_SUPPLICANT_ROAMING=y
CONFIG_WIFI_NM_MAX_MANAGED_INTERFACES=2
CONFIG_NRF70_ENABLE_DUAL_VIF=y
CONFIG_WIFI_MGMT_AP_MAX_NUM_STA=1
CONFIG_NRF_WIFI_IF_AUTO_START=n

# Rust can request filtered scans and receives results through a fixed bridge
# queue. These bounds affect only request metadata, not an unbounded heap.
CONFIG_WIFI_MGMT_SCAN_SSID_FILT_MAX=2
CONFIG_WIFI_MGMT_SCAN_CHAN_MAX_MANUAL=16

# Expose driver observations to Rust. TWT's normal Zephyr-IP precondition is
# disabled because the real address lives in embassy-net, not Zephyr IP.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_WIFI_MGMT_TWT_CHECK_IP=n

# The application body is the isolated Cargo staticlib under rust/app.
CONFIG_RUST=y
CONFIG_FPU=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Security invariants for the reusable foundation.  Require a hardware-backed
# cryptographically secure random source and keep Wi-Fi management diagnostics
# quiet; credentials and packet contents must not be logged.
CONFIG_CSPRNG_NEEDED=y
CONFIG_DEBUG_COREDUMP=n

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
# Hostap's stock Zephyr L2 backend uses an AF_PACKET/SOCK_DGRAM socket for
# EAPOL while the Rust data path uses its separate SOCK_RAW endpoint.
CONFIG_NET_SOCKETS_PACKET_DGRAM=y
CONFIG_POSIX_API=y
CONFIG_ZVFS_OPEN_MAX=40
CONFIG_ZVFS_POLL_MAX=4

# Stage 0 is a pure L2 proof.  Do not let an IP service or automatic address
# configuration silently become part of the foundation ABI.
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_DHCPV6=n
CONFIG_DNS_RESOLVER=n
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_SETTINGS=n

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_ETHERNET_FORWARD_UNRECOGNISED_ETHERTYPE=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Explicit bounded packet/context pools.  The fixed data size also keeps the
# packet-socket clone path bounded; an exhausted clone returns/drop-fails
# rather than blocking the nRF70 receive path.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_CONN_PACKET_CLONE_TIMEOUT=0
CONFIG_NET_TC_TX_COUNT=1

# Keep nRF70 driver allocations explicit and bounded as well.
CONFIG_NRF_WIFI_USE_VARIABLE_NET_BUFS=n
CONFIG_NRF70_RX_NUM_BUFS=16
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=40000
CONFIG_NRF_WIFI_ZERO_COPY_TX=n

# WPA supplicant uses the common heap in this configuration.  The value is a
# fixed upper bound, not a request for an unbounded allocator.
CONFIG_HEAP_MEM_POOL_SIZE=70000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_DEBUG_SHOW_KEYS=n

# Credentials are supplied by a later provisioning path or by the extended
# bridge entry point at runtime; no SSID/passphrase is present in this tree.
CONFIG_WIFI_CREDENTIALS=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_PRINTK=y

# Runtime provisioning input is owned and parsed by Rust.  Zephyr contributes
# only a bounded, nonblocking UART byte transport; no credential is stored in
# Kconfig or handled by the Zephyr shell.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETCHAR_BUFSIZE=128
CONFIG_CONSOLE_PUTCHAR_BUFSIZE=64
