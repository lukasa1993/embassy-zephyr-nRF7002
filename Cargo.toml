[package]
name = "embassy-nrf7002"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Native no_std Embassy driver core for the Nordic nRF7002"
repository = "https://github.com/lukasa1993/embassy-zephyr-nRF7002"
readme = "README.md"
keywords = ["embassy", "nrf7002", "wifi", "embedded", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]
publish = false

[features]
default = []
embassy-net = ["dep:embassy-net-driver", "dep:embassy-sync"]
wpa2 = ["dep:aes", "dep:hmac", "dep:pbkdf2", "dep:sha1", "dep:zeroize"]

[dependencies]
embedded-hal-async = "=1.0.0"
sha2 = { version = "=0.10.9", default-features = false }
embassy-net-driver = { version = "=0.2.0", default-features = false, optional = true }
embassy-sync = { version = "=0.6.2", default-features = false, optional = true }
aes = { version = "=0.8.4", default-features = false, optional = true }
hmac = { version = "=0.12.1", default-features = false, optional = true }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"], optional = true }
sha1 = { version = "=0.10.6", default-features = false, optional = true }
zeroize = { version = "=1.8.1", default-features = false, optional = true }

[dev-dependencies]
critical-section = { version = "=1.2.0", features = ["std"] }
